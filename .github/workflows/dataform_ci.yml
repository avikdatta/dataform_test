name: Dataform CI Unit Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dataform CLI
        run: npm install -g @dataform/cli

      - name: Verify Project Compilation
        run: dataform compile
      
      - name: Start BigQuery Emulator
        run: |
          docker run -d -p 9050:9050 ghcr.io/goccy/bigquery-emulator:latest --project=test-project
          
      - name: Create Mock Credentials File
        run: |
          cat <<EOF > .df-credentials.json
          {
            "projectId": "test-project",
            "location": "US"
          }
          EOF

      - name: Execute Unit Tests against Local Emulator
        env:
          BIGQUERY_EMULATOR_HOST: "localhost:9050"
        run: dataform test

