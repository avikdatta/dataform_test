name: Dataform CI Unit Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dataform CLI
        run: npm install -g @dataform/cli

      - name: Verify Project Compilation
        run: dataform compile
      
      - name: Start BigQuery Emulator
        run: |
          docker run -d -p 9050:9050 ghcr.io/goccy/bigquery-emulator:latest --project=test-project
          
      - name: Create Mock Credentials File
        run: |
          cat <<EOF > .df-credentials.json
          {
            "projectId": "test-project",
            "location": "US"
          }
          EOF

      - name: Execute Unit Tests against Local Emulator
        env:
          BIGQUERY_EMULATOR_HOST: "http://localhost:9050"
        run: dataform test
        
      - name: Install gcloud CLI and bq
        uses: google-github-actions/setup-gcloud@v2
  
      - name: Configure gcloud for emulator
        run: |
          gcloud config configurations create emulator
          gcloud config set auth/disable_credentials true
          gcloud config set account ci-emulator@example.com
          gcloud config set project test-project
          gcloud config set api_endpoint_overrides/bigquery http://localhost:9050/bigquery/v2/

      - name: Run bq against emulator
        env:
          CLOUDSDK_AUTH_ACCESS_TOKEN: "fake_token"
          CLOUDSDK_CORE_PROJECT: "test-project"
        run: |
          bq query --project_id=test-project --use_legacy_sql=false 'SELECT 1'
          bq mk --dataset test-project:test
          bq mk --dataset test-project:test2
          bq mk --dataset test-project:test3
          bq mk --project_id=test-project raw_data
          
          bq query --project_id=test-project --use_legacy_sql=false \
            'CREATE TABLE raw_data.ages (age INT64)'

          bq query --project_id=test-project --use_legacy_sql=false \
            'CREATE TABLE raw_data.drinks (drink_id INT64, drink_name STRING, drink_type STRING, calories INT64, date DATE, price FLOAT64)'

          bq query --project_id=test-project --use_legacy_sql=false \
            'CREATE TABLE raw_data.meals (meal_id INT64, meal_name STRING, meal_type STRING, calories INT64, date DATE, price FLOAT64, drink_id INT64)'

          bq query --project_id=test-project --use_legacy_sql=false \
            'INSERT INTO raw_data.ages (age) VALUES (25), (34), (45)'

          bq query --project_id=test-project --use_legacy_sql=false \
            'INSERT INTO raw_data.drinks (drink_id, drink_name, drink_type, calories, date, price) VALUES
              (1, "Cola", "soda", 140, "2024-01-01", 2.5),
              (2, "Orange Juice", "juice", 110, "2024-01-02", 3.0)'

          bq query --project_id=test-project --use_legacy_sql=false \
            'INSERT INTO raw_data.meals (meal_id, meal_name, meal_type, calories, date, price, drink_id) VALUES
              (1, "Burger", "lunch", 800, "2024-01-01", 9.5, 1),
              (2, "Salad", "dinner", 400, "2024-01-02", 7.0, 2)'
        
      - name: Execute Full Run against Local Emulator
        env:
          BIGQUERY_EMULATOR_HOST: "http://localhost:9050"
        run: dataform run
